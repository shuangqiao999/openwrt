# ======================
# 网络核心参数（基于J4125 + i226优化）
# ======================
fs.file-max = 2097152
fs.nr_open = 1048576
fs.aio-max-nr = 1048576
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288

# 缓冲区设置（匹配4096环缓冲区）
net.core.rmem_default = 262144             # 256KB
net.core.wmem_default = 262144             # 256KB
net.core.rmem_max = 67108864               # 64MB
net.core.wmem_max = 67108864               # 64MB

# 队列和预算
net.core.netdev_max_backlog = 10000        # 适中，防DDos同时降低延迟
net.core.netdev_budget = 1200              # 已优化，适合多队列
net.core.somaxconn = 65536                 # 增加，支持更多并发连接
net.core.optmem_max = 262144               # 256KB，支持更大的socket选项
net.core.dev_weight = 64
net.core.message_cost = 5
net.core.message_burst = 100
net.core.netdev_tstamp_prequeue = 1

# 忙轮询（J4125性能有限，不宜过度）
net.core.busy_poll = 50                    # 减小，30微秒
net.core.busy_read = 40                    # 减小，20微秒

# ======================
# TCP/IPv4优化
# ======================
# TCP内存（平衡小包和大流量）
net.ipv4.tcp_rmem = 4096 131072 33554432   # 32MB最大
net.ipv4.tcp_wmem = 4096 65536 16777216    # 16MB最大
net.ipv4.tcp_mem = 786432 1048576 1572864  # 增加总限制

# UDP内存（路由器需要适中的UDP缓冲区）
net.ipv4.udp_mem = 131072 196608 262144    # 增加
net.ipv4.udp_rmem_min = 16384              # 16KB
net.ipv4.udp_wmem_min = 16384              # 16KB

# 连接管理
net.ipv4.tcp_max_tw_buckets = 200000       # 增加，支持更多TIME_WAIT
net.ipv4.tcp_max_orphans = 131072          # 增加，13万
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_max_syn_backlog = 65536       # 增加，6.5万

# TCP选项
net.ipv4.tcp_tw_reuse = 1                  # 改为1（更安全）
net.ipv4.tcp_fin_timeout = 15              # 稍增加，15秒
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_syn_retries = 3               # 增加，3次重试
net.ipv4.tcp_synack_retries = 3            # 增加，3次重试
net.ipv4.tcp_ecn = 1                       # 改为1（启用）
net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1
net.ipv4.tcp_fack = 0
net.ipv4.tcp_notsent_lowat = 32768         # 增加，32KB
net.ipv4.tcp_mtu_probing = 1               # 改为1（启用）
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_workaround_signed_windows = 0
net.ipv4.tcp_thin_linear_timeouts = 0

# 拥塞控制和性能
net.ipv4.tcp_reordering = 6                # 增加，6次重排（更宽容）
net.ipv4.tcp_keepalive_time = 600          # 增加，10分钟
net.ipv4.tcp_keepalive_probes = 5          # 增加，5次探测
net.ipv4.tcp_keepalive_intvl = 15          # 增加，15秒间隔
net.ipv4.tcp_retries1 = 3                  # 增加，3次重试
net.ipv4.tcp_retries2 = 8                  # 增加，8次重试
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq_codel

# 其他TCP优化
net.ipv4.tcp_min_tso_segs = 2              # 减小，2段（适合小包）
net.ipv4.tcp_no_metrics_save = 0           # 改为0（保存指标，提高性能）
net.ipv4.tcp_limit_output_bytes = 524288   # 增加，512KB
net.ipv4.tcp_adv_win_scale = 1             # 改为1（平衡）
net.ipv4.tcp_min_rtt_wlen = 600            # 增加，600秒
net.ipv4.tcp_moderate_rcvbuf = 1
net.ipv4.tcp_autocorking = 1
net.ipv4.tcp_invalid_ratelimit = 500       # 增加，500
net.ipv4.tcp_early_retrans = 3             # 增加，3次早期重传
net.ipv4.tcp_recovery = 1
net.ipv4.tcp_abort_on_overflow = 0
net.ipv4.tcp_stdurg = 0
net.ipv4.tcp_rfc1337 = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_frto = 2
net.ipv4.tcp_syn_linear_timeouts = 0
net.ipv4.tcp_challenge_ack_limit = 1000    # 增加，1000
net.ipv4.udp_early_demux = 1
net.ipv4.udp_l3mdev_accept = 1

# ======================
# 连接追踪优化
# ======================
# 增加连接数限制（J4125可处理更多）
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_buckets = 65536

# 超时设置（平衡）
net.netfilter.nf_conntrack_tcp_timeout_established = 86400  # 24小时
net.netfilter.nf_conntrack_udp_timeout_stream = 180
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 120      # 增加，120秒
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 60        # 增加，60秒
net.netfilter.nf_conntrack_tcp_loose = 1
net.netfilter.nf_conntrack_tcp_be_liberal = 0
net.netfilter.nf_conntrack_expect_max = 16384               # 增加，16384
net.netfilter.nf_conntrack_checksum = 0
net.netfilter.nf_conntrack_acct = 1                        # 禁用，减少开销
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 60       # 增加，60秒
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 60       # 增加，60秒
net.netfilter.nf_conntrack_tcp_timeout_max_retrans = 300   # 增加，300秒
net.netfilter.nf_conntrack_icmp_timeout = 30               # 增加，30秒
net.netfilter.nf_conntrack_generic_timeout = 120           # 增加，120秒
net.netfilter.nf_conntrack_events = 1                      # 禁用，减少开销
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 60     # 增加，60秒
net.netfilter.nf_conntrack_tcp_timeout_last_ack = 30       # 增加，30秒
net.netfilter.nf_conntrack_tcp_timeout_close = 20          # 增加，20秒
net.netfilter.nf_conntrack_udp_timeout = 30                # 增加，30秒

# ======================
# 内存管理优化
# ======================
vm.swappiness = 0                         # 适度交换
vm.overcommit_memory = 1                   # 改为1（总是过度分配）
vm.overcommit_ratio = 80                   # 增加，80%
vm.dirty_ratio = 20                        # 增加，20%
vm.dirty_background_ratio = 10             # 增加，10%
vm.dirty_writeback_centisecs = 500         # 增加，5秒
vm.dirty_expire_centisecs = 3000           # 增加，30秒
vm.vfs_cache_pressure = 100                # 平衡值
vm.min_free_kbytes = 131072                # 128MB（8GB的1.5%）
vm.watermark_scale_factor = 100            # 平衡值，100
vm.page-cluster = 3                        # 改为3（适合网络应用）
vm.mmap_min_addr = 65536
vm.admin_reserve_kbytes = 8192             # 8MB
vm.user_reserve_kbytes = 131072            # 128MB
vm.extfrag_threshold = 500
vm.compaction_proactiveness = 20           # 增加，20
vm.dirtytime_expire_seconds = 86400        # 24小时
vm.max_map_count = 524288                  # 增加，52万
kernel.kptr_restrict = 2                   # 改为2（更安全）
kernel.perf_event_paranoid = 2
kernel.randomize_va_space = 2
kernel.panic = 30                          # 增加，30秒
kernel.panic_on_oops = 1                   # 改为1（panic on oops）
kernel.core_uses_pid = 1
kernel.core_pattern = /tmp/core-%e-%p-%t

# ======================
# 安全设置
# ======================
net.ipv4.conf.all.rp_filter = 1            # 改为1（松散模式）
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.forwarding = 1
net.ipv4.conf.default.forwarding = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.conf.all.log_martians = 0
net.ipv4.conf.default.log_martians = 0
net.ipv4.icmp_ratelimit = 100              # 增加，100
net.ipv4.icmp_ratemask = 8801
net.ipv4.ip_local_port_range = 32768 60999 # 改为标准范围
net.ipv4.ip_no_pmtu_disc = 0
net.ipv4.route.max_size = 8388608          # 增加，8MB
net.ipv4.route.gc_thresh = 524288          # 增加，52万
net.ipv4.route.gc_timeout = 300            # 增加，300秒

# IPv6设置
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
net.ipv6.conf.all.autoconf = 0
net.ipv6.conf.default.autoconf = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.route.max_size = 8388608          # 增加，8MB
net.ipv6.route.gc_thresh = 32768           # 增加，32768
net.ipv6.ip6frag_time = 60                 # 增加，60秒

# 共享内存（路由器不需要太大）
kernel.shmall = 2097152                    # 2GB
kernel.shmmax = 4294967296                 # 4GB
kernel.shmmni = 1024                       # 1024

# 最后一些TCP优化
net.ipv4.tcp_tso_win_divisor = 3